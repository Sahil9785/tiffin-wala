[build]
  publish = "."
  functions = "netlify/functions"

# API Redirects for Netlify Serverless Functions
[[redirects]]
  from = "/api/create-order"
  to = "/.netlify/functions/create-razorpay-order"
  status = 200

[[redirects]]
  from = "/api/verify-payment"
  to = "/.netlify/functions/verify-razorpay-payment"
  status = 200

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200
